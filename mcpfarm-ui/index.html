<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#212121" />
    <title>Hackerdogs MCP Farm</title>
    <!-- Favicon (Hackerdogs) — vector-first, all sizes generated from public/images/logo.svg.
         SVG for modern browsers; multi-size .ico + PNGs as fallbacks. Bump ?v= to bust cache. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=hd6" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico?v=hd6" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png?v=hd6" />
    <link rel="icon" type="image/png" sizes="16x16" href="/images/favicon-16x16.png?v=hd6" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/favicon/apple-touch-icon.png?v=hd6" />
    <link rel="icon" type="image/png" sizes="192x192" href="/images/favicon/android-chrome-192x192.png?v=hd6" />
    <link rel="icon" type="image/png" sizes="512x512" href="/images/favicon/android-chrome-512x512.png?v=hd6" />
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('worldmonitor-theme');
          document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark';
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
    <style>
      html, body { margin: 0; padding: 0; background: #212121; color: #ececec; }
      html[data-theme="light"] body { background: #ffffff; color: #0d0d0d; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
