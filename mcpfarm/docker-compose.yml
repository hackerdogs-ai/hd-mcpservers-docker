version: "3.8"

services:
  # -----------------------------------------------------------------------
  # Cloudflare Tunnel
  # -----------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: mcpfarm-tunnel
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN}
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    network_mode: "service:caddy"
    depends_on:
      caddy:
        condition: service_healthy
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Caddy reverse proxy
  # -----------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    container_name: mcpfarm-caddy
    ports:
      - "${FARM_PORT:-8485}:80"
      - "2019:2019"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_routes:/etc/caddy/dynamic
    networks:
      - mcpfarm
    depends_on:
      auth-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 5s
      timeout: 3s
      retries: 6
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Farm UI
  # -----------------------------------------------------------------------
  mcpfarm-ui:
    build:
      context: ../mcpfarm-ui
      dockerfile: Dockerfile
    image: hackerdogs/mcpfarm-ui:latest
    container_name: mcpfarm-ui
    networks:
      - mcpfarm
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # Auth Gateway
  # -----------------------------------------------------------------------
  auth-gateway:
    build: ./auth-gateway
    image: hackerdogs/auth-gateway:latest
    container_name: mcpfarm-auth
    user: root
    environment:
      - ADMIN_SECRET=${ADMIN_SECRET}
      - AUTH_DB_PATH=/data/auth.db
      - READMES_ROOT=/repo
      - UI_UPSTREAM=${UI_UPSTREAM:-mcpfarm-ui:3000}
    volumes:
      - auth_data:/data
      - caddy_routes:/etc/caddy/dynamic
      - /var/run/docker.sock:/var/run/docker.sock
      - ./port-map.json:/app/port-map.json:ro
      - ..:/repo:ro
    networks:
      - mcpfarm
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    restart: unless-stopped

  # -----------------------------------------------------------------------
  # MCP Servers (auto-generated from port-map.json)
  # -----------------------------------------------------------------------

  a2a-scanner-mcp:
    image: hackerdogs/a2a-scanner-mcp:latest
    container_name: a2a-scanner-mcp
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=8341
    networks:
      - mcpfarm
    restart: 'no'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  abstract-mcp:
    image: hackerdogs/abstract-mcp:latest
    container_name: abstract-mcp
    environment:
      - MCP_TRANSPORT=streamable-http
      - MCP_PORT=8501
      - ABSTRACT_PHONE_API_KEY=${ABSTRACT_PHONE_API_KEY}
      - ABSTRACT_EMAIL_API_KEY=${ABSTRACT_EMAIL_API_KEY}
      - ABSTRACT_IBAN_API_KEY=${ABSTRACT_IBAN_API_KEY}
      - ABSTRACT_VAT_API_KEY=${ABSTRACT_VAT_API_KEY}
      - ABSTRACT_IP_API_KEY=${ABSTRACT_IP_API_KEY}
      - ABSTRACT_HOLIDAYS_API_KEY=${ABSTRACT_HOLIDAYS_API_KEY}
      - ABSTRACT_EXCHANGE_API_KEY=${ABSTRACT_EXCHANGE_API_KEY}
      - ABSTRACT_COMPANY_API_KEY=${ABSTRACT_COMPANY_API_KEY}
      - ABSTRACT_TIMEZONE_API_KEY=${ABSTRACT_TIMEZONE_API_KEY}
    networks:
      - mcpfarm
    restart: 'no'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
